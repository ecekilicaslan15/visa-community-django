<!doctype html>
<html lang="en">
<body style="margin:0;background:#F4EFE6;font-family:Georgia,serif;color:#14283C;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#F4EFE6;padding:24px 12px;">
    <tr><td align="center">
      <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:520px;background:#FFFDF8;border:1px solid #E4D9C8;border-radius:16px;padding:28px 24px;">
        <tr><td>
          <p style="margin:0 0 8px;font-family:ui-monospace,monospace;letter-spacing:.14em;text-transform:uppercase;font-size:12px;color:#0E6B66;">VisaCommunity</p>
          <h1 style="margin:0 0 12px;font-size:24px;line-height:1.2;">Confirm your email</h1>
          <p style="margin:0 0 16px;line-height:1.5;">{{ user.get_username }}, confirm {{ user.email }} so you can post, reply, and report appointment openings.</p>
          <p style="margin:0 0 20px;">
            <a href="{{ verify_url }}" style="display:inline-block;background:#0E6B66;color:#fff;text-decoration:none;padding:12px 18px;border-radius:999px;font-family:sans-serif;font-weight:600;">Confirm email</a>
          </p>
          <p style="margin:0;color:#5C6B7A;font-size:14px;line-height:1.5;">The link works for 3 days. If you didn't create this account, you can ignore this email.</p>
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
