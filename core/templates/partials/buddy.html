{% comment %}
  Visa Buddy mascot.
  {% include "partials/buddy.html" with w=120 h=127 pose="wave" %}
  pose: "wave" (welcome) · "coffee" (waiting/prediction, default) · "suitcase" (empty states) · "success"
  Older includes may pass wave=True instead of pose="wave".
{% endcomment %}
<svg width="{{ w|default:120 }}" height="{{ h|default:127 }}" viewBox="0 0 170 180" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Visa Buddy, a friendly passport mascot">
  <ellipse cx="85" cy="169" rx="37" ry="6" fill="rgba(20,40,60,.08)"/>
  <path d="M75 146 V162 M107 146 V162" stroke="#14283C" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M75 162 H66 M107 162 H116" stroke="#14283C" stroke-width="3.2" stroke-linecap="round"/>
  <rect x="48" y="42" width="74" height="104" rx="13" fill="#0E6B66"/>
  <rect x="60" y="42" width="62" height="104" rx="13" fill="#FFFDF8"/>
  <line x1="61" y1="45" x2="61" y2="143" stroke="#14283C" stroke-width="2" opacity=".45"/>
  <rect x="48" y="42" width="74" height="104" rx="13" fill="none" stroke="#14283C" stroke-width="3"/>
  <text x="92" y="60" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="7.2" letter-spacing="2.4" fill="#14283C" opacity=".55">PASSPORT</text>
  {% if pose == "success" %}
  <path d="M73 85 q5 -6 10 0 M97 85 q5 -6 10 0" fill="none" stroke="#14283C" stroke-width="2.8" stroke-linecap="round"/><path d="M81 94 Q91 106 101 94" fill="none" stroke="#14283C" stroke-width="2.6" stroke-linecap="round"/>
  {% else %}
  <circle cx="78" cy="84" r="3.6" fill="#14283C"/><circle cx="104" cy="84" r="3.6" fill="#14283C"/><path d="M83 96 Q91 104 99 96" fill="none" stroke="#14283C" stroke-width="2.6" stroke-linecap="round"/>
  {% endif %}
  <circle cx="73" cy="95" r="3" fill="#E3A075" opacity=".4"/>
  <circle cx="109" cy="95" r="3" fill="#E3A075" opacity=".4"/>
  <g opacity=".8" stroke="#14283C" stroke-width="1.9" fill="none">
    <circle cx="91" cy="124" r="10"/><ellipse cx="91" cy="124" rx="4.4" ry="10"/><line x1="81" y1="124" x2="101" y2="124"/>
  </g>
  {% if pose == "wave" or wave %}
  <path d="M48 100 Q34 104 30 116" fill="none" stroke="#14283C" stroke-width="3.2" stroke-linecap="round"/><path d="M122 92 Q140 84 144 66" fill="none" stroke="#14283C" stroke-width="3.2" stroke-linecap="round"/><path d="M150 62 q4 -3 5 -7 M152 72 q5 -1 8 -4" fill="none" stroke="#14283C" stroke-width="2" stroke-linecap="round" opacity=".45"/>
  {% elif pose == "suitcase" %}
  <path d="M48 100 Q34 104 30 116" fill="none" stroke="#14283C" stroke-width="3.2" stroke-linecap="round"/><path d="M122 100 Q134 104 137 114" fill="none" stroke="#14283C" stroke-width="3.2" stroke-linecap="round"/><path d="M132 116 v-5 a5 5 0 0 1 5 -5 h4 a5 5 0 0 1 5 5 v5" fill="none" stroke="#14283C" stroke-width="2.4"/><rect x="122" y="116" width="34" height="26" rx="5" fill="#F9EEDB" stroke="#14283C" stroke-width="2.6"/><circle cx="149" cy="123" r="3.4" fill="none" stroke="#0E6B66" stroke-width="1.8"/><line x1="122" y1="129" x2="156" y2="129" stroke="#14283C" stroke-width="1.6" opacity=".4"/>
  {% elif pose == "success" %}
  <path d="M48 94 Q34 84 32 70" fill="none" stroke="#14283C" stroke-width="3.2" stroke-linecap="round"/><path d="M122 94 Q136 84 138 70" fill="none" stroke="#14283C" stroke-width="3.2" stroke-linecap="round"/><g opacity=".85"><circle cx="34" cy="52" r="3" fill="#0E6B66"/><rect x="140" y="46" width="6" height="6" rx="1.5" fill="#C97B22" transform="rotate(18 143 49)"/><circle cx="152" cy="96" r="2.6" fill="#B5443B"/><rect x="20" y="80" width="5" height="5" rx="1.2" fill="#14283C" opacity=".5" transform="rotate(-14 22 82)"/><path d="M56 28 l3 6 M118 24 l-3 6" stroke="#0E6B66" stroke-width="2" stroke-linecap="round"/></g>
  {% else %}
  <path d="M48 100 Q34 104 30 116" fill="none" stroke="#14283C" stroke-width="3.2" stroke-linecap="round"/><path d="M122 102 Q131 102 132 97" fill="none" stroke="#14283C" stroke-width="3.2" stroke-linecap="round"/><rect x="126" y="80" width="17" height="18" rx="3" fill="#FFFDF8" stroke="#14283C" stroke-width="2.4"/><path d="M143 84 a5 5 0 0 1 0 10" fill="none" stroke="#14283C" stroke-width="2.4"/><path d="M131 74 q2 -3 0 -6 M138 74 q2 -3 0 -6" fill="none" stroke="#14283C" stroke-width="1.8" stroke-linecap="round" opacity=".4"/>
  {% endif %}
</svg>
